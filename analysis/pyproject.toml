[project]
name = "order-book-analysis"
version = "0.1.0"
description = "Analysis tools for order book benchmark results"
requires-python = ">=3.12"

dependencies = [
  "numpy",
  "pandas",
  "matplotlib"
]

[project.optional-dependencies]
dev = [
  "pandas-stubs"
]

[project.scripts]
order-book-analyze = "order_book_analysis.cli:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
